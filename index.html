    :root {
        --main-bg-color: #e3ccd3;
        --text-color: rgba(0, 0, 0, 0.8);
        --link-color: rgba(0, 0, 0, 0.7);
        --link-hover-color: rgba(0, 0, 0, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .name, .subtitle, .links a {
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
    }

    body {
        font-family: 'Minecraft Ten', monospace;
        background: var(--main-bg-color);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .centered {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        row-gap: 20px;
        width: 100%;
        max-width: 800px;
        padding: 20px;
    }

    .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        row-gap: 10px;
    }

    .name {
        font-size: 100px;
        font-weight: 400;
        text-align: center;
        color: black;
    }

    .subtitle {
        font-size: 2em;
        font-weight: 400;
        opacity: 0.7;
        letter-spacing: 0.1em;
        text-align: center;
        color: var(--text-color);
    }

    .subtitle a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .subtitle a:hover {
        color: var(--link-hover-color);
    }

    .links {
        font-size: 1.2em;
        text-align: center;
    }

    .links a {
        color: var(--link-color);
        text-decoration: none;
        transition: all 0.2s ease;
        padding: 5px;
    }

    .links a:hover {
        text-decoration: underline;
        color: var(--link-hover-color);
    }

    .socials {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .socials a {
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }

    .socials a:hover {
        transform: scale(1.1);
    }

    .socials img {
        width: 40px;
        height: 40px;
    }

    .profile-pic {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
        .name {
            font-size: 4em;
        }

        .subtitle {
            font-size: 1.5em;
        }

        .socials img {
            width: 35px;
            height: 35px;
        }

        .links {
            font-size: 1em;
        }
    }

    @media (max-width: 480px) {
        .name {
            font-size: 3em;
        }

        .subtitle {
            font-size: 1.2em;
        }

        .socials img {
            width: 30px;
            height: 30px;
        }

        .links {
            font-size: 0.9em;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
        }
    }
</style>
